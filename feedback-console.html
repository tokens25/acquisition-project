<title>Acquisition Feedback Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  /* DAZN's own tokens — the subject's palette, not an invented one. */
  :root {
    --ground: #ffffff;
    --raised: #f5f7f8;
    --sunk: #e9edf0;
    --line: #cdd5da;
    --line-soft: #e9edf0;
    --ink: #080e12;
    --ink-mid: #3f4c55;
    --ink-soft: #626e78;
    --accent: #c8ce00;
    --accent-ink: #080e12;
    --wire: #b3bec6;
    --now: #c2410c;
    --next: #1e8a4a;
    --idea: #4f5bd5;
    --font: 'Archivo', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #080e12; --raised: #0c1216; --sunk: #10171b;
      --line: #21292e; --line-soft: #161d22;
      --ink: #fafbfc; --ink-mid: #bcc5cb; --ink-soft: #76828c;
      --accent: #f7ff1a; --accent-ink: #080e12; --wire: #384249;
      --now: #ff9166; --next: #79e99c; --idea: #a9b1ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #080e12; --raised: #0c1216; --sunk: #10171b;
    --line: #21292e; --line-soft: #161d22;
    --ink: #fafbfc; --ink-mid: #bcc5cb; --ink-soft: #76828c;
    --accent: #f7ff1a; --accent-ink: #080e12; --wire: #384249;
    --now: #ff9166; --next: #79e99c; --idea: #a9b1ff;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 0 88px;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1340px; margin: 0 auto; padding: 0 24px; }

  /* ── Masthead ─────────────────────────────────────── */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: var(--ground);
    border-bottom: 1px solid var(--line);
  }
  .top__inner {
    display: flex; flex-direction: column; gap: 14px;
    max-width: 1340px; margin: 0 auto; padding: 16px 24px 12px;
  }
  .top__line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .top__note { margin: 0; color: var(--ink-soft); font-size: 13px; }
  .lede__link { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  .lede__link:hover { color: var(--accent-ink); background: var(--accent); }


  /* ── View tabs ────────────────────────────────────── */
  .tabs { display: flex; gap: 8px; }
  .tab {
    display: flex; align-items: baseline; gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--ink-soft);
    font-family: var(--font); cursor: pointer;
  }
  .tab:hover { background: var(--sunk); color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab__label { font-size: 14px; font-weight: 700; letter-spacing: -0.005em; }
  .tab__note { font-size: 11.5px; color: var(--ink-soft); }
  .tab__badge {
    font-family: var(--mono); font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--ink-soft);
  }
  .tab__badge:empty { display: none; }
  .tab[aria-selected='true'] {
    background: var(--sunk);
    color: var(--ink);
    border-color: var(--ink-soft);
    box-shadow: inset 0 -3px 0 -1px var(--accent);
  }
  .tab[aria-selected='true'] .tab__note { color: var(--ink-mid); }
  .tab[aria-selected='true'] .tab__badge { color: var(--ink); }

  /* ── Sections ─────────────────────────────────────── */
  section { margin-top: 26px; scroll-margin-top: calc(var(--head-h, 168px) + 20px); }
  section[hidden] { display: none; }

  .sec-head {
    position: sticky; top: var(--head-h, 168px); z-index: 10;
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 0 8px;
    background: var(--ground);
    border: none; border-bottom: 1px solid var(--line);
    color: var(--ink); font-family: var(--font);
    text-align: left; cursor: pointer;
  }
  .sec-head:hover .sec-head__title { color: var(--ink-mid); }
  .sec-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sec-head__chev {
    flex: none; width: 9px; height: 9px;
    border-right: 1.6px solid var(--ink-soft);
    border-bottom: 1.6px solid var(--ink-soft);
    transform: rotate(45deg) translate(-1px, -1px);
    transition: transform 130ms ease;
  }
  section.shut .sec-head__chev { transform: rotate(-45deg) translate(-1px, 1px); }
  .sec-head__title {
    margin: 0; font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .sec-head__count { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .sec-head__count b { color: var(--next); font-weight: 500; }

  .sec-head__shared {
    padding: 2px 7px;
    border: 1px solid var(--line); border-radius: 999px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-soft);
  }

  .sec-blurb {
    margin: 7px 0 0;
    padding-left: 14px;
    color: var(--ink-soft);
    font-size: 12.5px;
  }
  section.shut .row, section.shut .addrow, section.shut .sec-blurb { display: none; }

  /* ── Rows ─────────────────────────────────────────── */
  .row {
    display: grid;
    grid-template-columns: 172px 128px minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 18px; align-items: start;
    padding: 14px 0 14px 14px;
    border-bottom: 1px solid var(--line-soft);
    position: relative;
  }
  .row[hidden] { display: none; }
  .row::before {
    content: ''; position: absolute;
    left: 0; top: 14px; bottom: 14px;
    width: 3px; border-radius: 2px; background: transparent;
  }
  .row[data-note]::before { background: var(--ink-soft); }
  .row[data-note][data-pri="now"]::before { background: var(--now); }
  .row[data-note][data-pri="next"]::before { background: var(--next); }
  .row[data-note][data-pri="idea"]::before { background: var(--idea); }

  .name { font-weight: 600; font-size: 14px; letter-spacing: -0.005em; }
  .anchor {
    display: block; margin-top: 3px;
    font-family: var(--mono); font-size: 11px;
    color: var(--ink-soft); word-break: break-all;
  }
  .what { color: var(--ink-mid); font-size: 13.5px; line-height: 1.55; }

  /* ── The wireframe column ─────────────────────────── */
  .vis {
    display: block; width: 100%; height: auto;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--raised);
  }
  .vis .w { fill: none; stroke: var(--wire); stroke-width: 0.9; }
  .vis .on-fill { fill: var(--accent); stroke: none; }
  .vis .on-wash { fill: var(--accent); opacity: 0.22; stroke: none; }
  .vis .on-edge { fill: none; stroke: var(--accent); stroke-width: 1.6; }
  .vis-none {
    display: flex; align-items: center; justify-content: center;
    min-height: 54px; padding: 6px;
    border: 1px dashed var(--line); border-radius: 6px;
    color: var(--ink-soft); font-size: 11px; text-align: center;
  }

  .cell { display: flex; flex-direction: column; gap: 7px; }
  textarea {
    width: 100%; min-height: 44px; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--raised); color: var(--ink);
    font-family: var(--font); font-size: 13.5px; line-height: 1.5;
    resize: none; overflow: hidden;
  }
  textarea::placeholder { color: var(--ink-soft); opacity: 0.75; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  .pri { display: flex; gap: 5px; }
  .row:not([data-note]) .pri { visibility: hidden; }
  .pri button {
    padding: 2px 9px;
    border: 1px solid var(--line); border-radius: 999px;
    background: transparent; color: var(--ink-soft);
    font-family: var(--font); font-size: 11px; font-weight: 600;
    letter-spacing: 0.03em; cursor: pointer;
  }
  .pri button:hover { color: var(--ink); }
  .pri button[aria-pressed="true"] { border-color: currentColor; }
  .pri button[data-p="now"][aria-pressed="true"]  { color: var(--now); }
  .pri button[data-p="next"][aria-pressed="true"] { color: var(--next); }
  .pri button[data-p="idea"][aria-pressed="true"] { color: var(--idea); }
  .pri button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The foot is always there. Hiding Send until a row had text made the page
     look like it had no send buttons at all, which is the opposite of the
     point — so Send stays visible and goes dim instead. */
  .cell__foot { display: flex; align-items: center; gap: 8px; }
  .send {
    padding: 3px 11px;
    border: 1px solid var(--accent); border-radius: 999px;
    background: transparent; color: var(--ink);
    font-family: var(--font); font-size: 11px; font-weight: 700;
    letter-spacing: 0.03em; cursor: pointer;
  }
  .send:hover { background: var(--accent); color: var(--accent-ink); }
  .send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .send[disabled] { opacity: 0.4; cursor: default; }
  .send[disabled]:hover { background: transparent; color: var(--ink); }

  .sent {
    margin: 0;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
    color: var(--ink-soft); white-space: pre-wrap;
  }
  .sent:empty { display: none; }
  #allstatus { margin: 20px auto 4px; }
  .sent[data-state='run'] { color: var(--ink-mid); }
  .sent[data-state='ok'] { color: var(--next); }
  .sent[data-state='err'] { color: var(--now); }

  .drop {
    border: none; background: transparent; color: var(--ink-soft);
    font-size: 11px; cursor: pointer; padding: 2px 0;
    text-align: left; font-family: var(--font);
  }
  .drop:hover { color: var(--now); }

  .addrow { padding: 16px 0 0 14px; }

  /* ── Action bar ───────────────────────────────────── */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--raised); border-top: 1px solid var(--line);
  }
  .bar__inner {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    max-width: 1340px; margin: 0 auto; padding: 12px 24px;
  }
  .tally {
    font-family: var(--mono); font-size: 12.5px;
    color: var(--ink-soft); font-variant-numeric: tabular-nums;
  }
  .tally b { font-weight: 500; color: var(--ink); }
  .tally .c-now { color: var(--now); }
  .tally .c-next { color: var(--next); }
  .tally .c-idea { color: var(--idea); }
  .spacer { flex: 1; }
  .toast { font-family: var(--mono); font-size: 12px; color: var(--next); }

  button.act {
    padding: 8px 14px;
    border: 1px solid var(--line); border-radius: 7px;
    background: transparent; color: var(--ink);
    font-family: var(--font); font-size: 13.5px; font-weight: 600;
    cursor: pointer;
  }
  button.act:hover { background: var(--sunk); }
  button.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.act[aria-pressed="true"] { background: var(--sunk); border-color: var(--ink-soft); }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.act.primary:hover { filter: brightness(0.93); }
  button.act.quiet { border-color: transparent; color: var(--ink-soft); font-weight: 500; }
  button.act.quiet:hover { color: var(--ink); background: transparent; }

  @media (max-width: 1100px) {
    .row { grid-template-columns: 150px 116px minmax(0, 1fr); }
    .row .cell { grid-column: 1 / -1; }
  }
  @media (max-width: 760px) {
    .row { grid-template-columns: 110px minmax(0, 1fr); gap: 12px; }
    .row .what { grid-column: 1 / -1; }
    .sec-head { top: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .sec-head__chev { transition: none; } }
</style>

<header class="top">
  <div class="top__inner">
    <div class="top__line">
      <h1>Acquisition Feedback Console</h1>
      <p class="top__note" id="lede">Find the area, say what should change, mark how soon.</p>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Which view"></nav>
  </div>
</header>

<main class="wrap" id="sheet"></main>
<p class="wrap sent" id="allstatus"></p>

<div class="bar">
  <div class="bar__inner">
    <span class="tally" id="tally">Nothing noted yet</span>
    <span class="toast" id="toast"></span>
    <span class="spacer"></span>
    <button class="act quiet" id="clear">Clear all</button>
    <button class="act" id="copy">Copy feedback</button>
    <button class="act primary" id="sendall" hidden>Send all to Claude</button>
  </div>
</div>

    ['panel-default', 'Panel', 'default', 'The left column when you are not editing a step. It asks which situation you are writing content for.', [
      ['context fields', '.demo__fields', 'The dropdowns as a set. Three of them normally, four when your answers describe more than one journey.', 'panelDefault'],
      ['market', 'dropdown 1', 'Which country you are writing for — or "Base", meaning the shared content every country starts from. The help text under it tells you which of the two you are doing.', 'panelDefault'],
      ['user status', 'dropdown 2', 'Who is buying: someone logged out, an existing customer, someone being migrated, or a TVE user. This choice decides which family of journeys you get.', 'panelDefault'],
      ['entry point', 'dropdown 3', 'Where they clicked in from. Narrowed by the answer above — someone being migrated never arrives from an Upgrade button.', 'panelDefault'],
      ['which journey', 'dropdown 4', 'Only appears when your three answers describe more than one journey, and lets you pick between them. Most combinations describe exactly one, so most of the time you never see it.', 'panelDefault'],
      ['user flow', '.uf', 'The journey written out as a numbered list. It is the same information as the tiles on the right, and they share a selection — clicking either opens the same step.', 'panelDefault'],
      ['flow heading', '.uf__title', 'The words "User flow:" above the list.', 'panelDefault'],
      ['flow list', '.uf__list', 'The numbered list itself.', 'panelDefault'],
      ['flow item', '.uf__item', 'One entry in the list, holding the step and the connector line drawn above it.', 'panelDefault'],
      ['flow row', '.uf__row', 'One step in the list. Highlights when selected, and dims when the journey skips it.', 'panelDefault'],
      ['flow dot', '.uf__dot', 'The circle at the left of a row. It holds a tick when that step has fields you can actually edit — today only Subscription does, and the list says so rather than pretending otherwise.', 'panelDefault'],
      ['flow name', '.uf__name', 'The step name.', 'panelDefault'],
      ['flow skip tag', '.uf__tag', 'A small "seeded" or "not here" on steps this journey skips. "Seeded" means the entry point already answered that question; "not here" means the step does not exist in this journey.', 'panelDefault'],
      ['flow edit button', '.uf__edit', 'The pencil that opens a step. Only on steps that have something to edit.', 'panelDefault'],
      ['flow connector', '.uf__link', 'The short line drawn between one row and the next, so the list reads as a sequence.', 'panelDefault'],
      ['hidden steps note', '.pl-hidden-note', 'One muted line under the list in Dev mode — "4 not ready yet · hidden in Dev". It names what the list is leaving out, so a short list reads as filtered rather than as the whole journey.', 'panelDefault'],
      ['reset progress', '.demo__reset', 'The link at the bottom. Throws away your local edits and reloads the content the app shipped with.', 'panelDefault'],
    ]],
    ['preview-default', 'Preview', 'default', 'The right column when you are not editing. Shows the whole journey at once.', [
      ['frames block', '.jf', 'The journey overview as a whole.', 'overview'],
      ['row caption', '.jf__caption', 'The line above the tiles: how many screens across how many steps.', 'overview'],
      ['drag hint', '.jf__hint', 'The reminder that you can drag a step sideways to reorder it, or hold alt and use the arrow keys.', 'overview'],
      ['reordered chip', '.jf__reordered', 'A small marker that appears once your order no longer matches the order drawn in Figma.', 'overview'],
      ['reset order', '.jf__reset', 'Puts the steps back into the Figma order.', 'overview'],
      ['frames row', '.jf__row', 'The row of screens that scrolls sideways.', 'overview'],
      ['step group', '.jf__step', 'One step together with all its screens. This is the block you drag when reordering.', 'overview'],
      ['step label', '.jf__step-name', 'The step name above its screens.', 'overview'],
      ['state count', '.jf__states', 'Says "· 3 states" when a step is drawn more than one way.', 'overview'],
      ['skip tag', '.jf__tag', 'A "seeded" or "not here" marker explaining why a step shows nothing.', 'overview'],
      ['tiles strip', '.jf__tiles', 'The screens belonging to one step, side by side.', 'overview'],
      ['tile cell', '.jf__cell', 'One tile and the caption under it, kept together so the caption tracks the screen it names.', 'overview'],
      ['step tile', '.jf__tile', 'One screen. Click it to edit that step.', 'overview'],
      ['tile number', '.jf__num', 'Where the step falls in the flow, beside its name. A step drawn three ways occupies three numbers and shows the span — 6–8 — so the last number in the row still equals the journey’s screen count.', 'overview'],
      ['thumbnail', '.jf__thumb', 'A live miniature of the real screen, built from your actual content. Sized to the proportions of a 375 by 812 phone.', 'overview'],
      ['thumbnail scaler', '.jf__thumb-scale', 'The layer inside the thumbnail that shrinks the screen. The screen renders at full size and this scales it down, so the miniature is the real thing rather than a separate small version that could drift from it.', 'overview'],
      ['phone status bar', '.jf__status', 'The iOS status bar across the top of a tile — the iOS/android component from Figma, drawn at the tile’s scale here and at its own size in the prototype — one component, two scales, rather than two drawings that could drift. Static, so it holds still while the screen scrolls beneath it; each frame’s own status bar is clipped off the export and this one drawn in its place.', 'overview'],
      ['status time', '.jf__status-time', 'The clock. Always 9:41, as the design has it.', 'overview'],
      ['notch spacer', '.jf__status-island', 'The gap the Dynamic Island sits in. It draws nothing and reserves 124px, which is why the clock sits left of centre rather than in the middle.', 'overview'],
      ['status levels', '.jf__status-levels', 'The signal, wifi and battery group at the right.', 'overview'],
      ['signal icon', '.jf__status-cell', 'Cellular bars, exported from the component.', 'overview'],
      ['wifi icon', '.jf__status-wifi', 'Wifi, exported from the component.', 'overview'],
      ['battery icon', '.jf__status-battery', 'Battery, exported from the component.', 'overview'],
      ['browser chrome', '.jf__chrome', 'The Safari address bar at the foot of a tile — the .Safari, iOS component from Figma, drawn at the tile’s scale here and at its own size in the prototype, so it is the design’s own geometry rather than an approximation of it. It is pinned rather than left in the picture, so it holds still while the screen scrolls behind it; each frame’s own bar is clipped off and this one drawn in its place.', 'overview'],
      ['chrome button', '.jf__chrome-btn', 'One of the two round 44px buttons either side of the address — back on the left, menu on the right.', 'overview'],
      ['address pill', '.jf__url', 'The rounded bar holding the site icon, the domain and the reload arrow.', 'overview'],
      ['site settings icon', '.jf__url-icon', 'The page-settings glyph at the left of the pill, exported from the Figma component.', 'overview'],
      ['address text', '.jf__url-text', 'The domain. Centred in the whole pill rather than in the gap between the icons, so a longer name stays centred.', 'overview'],
      ['reload icon', '.jf__url-reload', 'The refresh arrow at the right of the pill, exported from the Figma component.', 'overview'],
      ['browser menu', '.jf__dots', 'The three dots in the right-hand button. iOS draws it as an SF Symbol, which has no exported asset, so it is three dots at the symbol’s own size.', 'overview'],
      ['screen', '.jf__screen', 'Everything above the address bar, taking all the height the bar does not. A screen taller than that scrolls here rather than shrinking to fit — Checkout is 1321 tall, and fitting it would make the payment rows too small to read.', 'overview'],
      ['page clip', '.jf__page', 'Holds the exported picture and crops the Safari bar off its foot. Its height is the frame’s own height less that bar, at the tile’s scale, so it is set per screen rather than in the stylesheet.', 'overview'],
      ['screen artwork', '.jf__art', 'The screen exported from Figma, shown on steps that have not been built yet. Full tile width, natural height. It is a picture, so it does not change when you edit content — that is how you tell a built screen from one still to come.', 'overview'],
      ['frame name', '.jf__frame', 'The Figma frame name. The last resort, for a screen with neither a component nor an exported frame.', 'overview'],
      ['state label', '.jf__state', 'Which version of the screen a tile is — “standard”, “ultimate”. Sits under the tile rather than over it, where it covered the design it was labelling.', 'overview'],
    ]],
    ['prototype', 'Prototype', 'default', 'What Preview opens: the journey running at full size, one screen at a time, over the tool. The frames row is the flow as a picture; this is the flow as a person meets it. Everything on a screen here is the live render, so it shows the content you wrote rather than the design it was drawn from — walking it is how you check that what you wrote reads in order. Screens rather than steps, so a step drawn three ways is three taps, and the count matches the row behind it.', [
      ['prototype', '.proto', 'The dim over the whole tool. Clicking it closes, as does Escape.', 'prototype'],
      ['prototype stage', '.proto__stage', 'The phone and the bar under it, kept together so the bar tracks the phone rather than the window.', 'prototype'],
      ['prototype phone', '.proto__phone', 'The device: 375 by 812, the frame the Figma section draws every screen in. On a display too short to hold it, the whole phone scales down rather than the screen being clipped.', 'prototype'],
      ['prototype screen', '.proto__page', 'The screen itself, between the status bar and the address bar. Tap something that looks like a control and the flow moves on; tap anywhere else and the controls outline themselves for a moment, so a miss says where to aim rather than doing nothing. The two screens longer than a phone scroll here, the way they scroll on one.', 'prototype'],
      ['address bar back', '.proto__back', 'The chevron in the address bar, which goes back a screen. A control here rather than the picture of one the frames row draws, so it dims on the first screen.', 'prototype'],
      ['prototype bar', '.proto__bar', 'The controls under the phone. Under it rather than over it, because the screen is the thing being shown.', 'prototype'],
      ['prototype step button', '.proto__step', 'Back and on a screen. The arrow keys do the same, and each dims at the end it cannot pass.', 'prototype'],
      ['prototype position', '.proto__where', 'Where you are, in two lines.', 'prototype'],
      ['screen count', '.proto__count', 'Which screen of how many. The same count the row above the frames reports, because it is the same list.', 'prototype'],
      ['screen name', '.proto__name', 'The step this screen belongs to.', 'prototype'],
      ['screen state', '.proto__state', 'Which of the step\u2019s states this is, on the steps drawn more than one way.', 'prototype'],
      ['start again', '.proto__restart', 'Replaces the on button at the last screen, rather than leaving a dead control there.', 'prototype'],
      ['prototype close', '.proto__close', 'Closes the prototype and puts you back where you were.', 'prototype'],
    ]],
    ['actions-default', 'Action buttons', 'default', 'Two buttons at the top right when you are not editing a step.', [
      ['preview button', 'button 1 · secondary', 'Hides the panel so the preview fills the window. Press it again — it now says "Show panel" — to bring the panel back.', 'actionsDefault'],
      ['export button', 'button 2 · tertiary', 'Says "Export JSON". Downloads all the content as a file. Worth knowing: this is the shape this app stores, not yet the shape the live rule engine reads.', 'actionsDefault'],

    ['panel-edit', 'Panel', 'edit', 'The left column once you have opened a step. Six groups of fields, all scoped to one country, one storefront and one way of paying.', [
      ['step heading', '.demo__head', 'The line at the top of the panel: the back arrow and the step title together.', 'panelEdit'],
      ['back arrow', '.demo__back', 'The chevron at the top left. It is the only thing on that line you can click, and it takes you back to the journey.', 'panelEdit'],
      ['step title', '.demo__step-title', 'The name of the step you have open. A heading, not a control — the arrow beside it is what takes you back.', 'panelEdit'],
      ['step status chip', '.pl-head-chip', 'Holds the handoff status chip beside the step title, so where a page stands sits with its name rather than only in the journey list.', 'panelEdit'],
      ['field group', '.demo__group', 'One titled block of fields. There are six of them.', 'panelEdit'],
      ['group title', '.demo__group-title', 'The heading on a group. Pricing adds the currency to its heading.', 'panelEdit'],
      ['plans group', 'group 1 · Plans', 'Which plan you are editing.', 'panelEdit'],
      ['header group', 'group 2 · Tier', 'The words at the top of the card.', 'panelEdit'],
      ['pricing group', 'group 3 · Pricing', 'What it costs and how you pay.', 'panelEdit'],

      ['features group', 'group 6 · Features', 'The bullet list of what you get.', 'panelEdit'],
      ['add button', '.ed-add', 'The "Add competition" and "Add benefit" buttons — one control shared by both groups. Switched off when there is nothing left to add, or when benefits have reached the five a card shows.', 'panelEdit'],
      ['nothing ready note', '.pl-empty', 'What both columns show in Dev mode before Market has marked anything ready. It appears in the panel and the preview rather than leaving either blank.', 'panelEdit'],

    ['group-plans', 'Plans group', 'edit', 'Group 1. Picks which plan the rest of the panel is about.', [
      ['plan tabs', '.ed-tabs', 'The row of plan names you switch between. Not a setting — it chooses which plan the whole panel below is editing.', 'groupPlans'],
      ['plan tab', '.ed-tab', 'One plan name. Dimmed when that plan is not sold in the situation you picked, and hovering it tells you why.', 'groupPlans'],
      ['plan not sold note', '.ed-absent', 'Appears when you are looking at a plan this situation does not sell. It says why, and reassures you that your edits still apply everywhere the plan does sell.', 'groupPlans'],
      ['no plans message', '.ed-placeholder · plans', 'What the panel says instead of a form when the content has no plans at all.', 'groupPlans'],
    ]],
    ['group-header', 'Header group', 'edit', 'Group 2. The words at the top of the card.', [
      ['badge field', 'Badge', 'The words on the badge. Editable — type what it should say. Whether a badge shows at all is still the Highlighted Tier switch’s call, and leaving this empty falls back to “BEST EXPERIENCE” rather than shipping a blank ribbon.', 'groupHeader'],
      ['ultimate toggle', 'Highlighted Tier', 'The switch that makes this the standout plan: gold outline, badge and gold button. Only one plan in a set may have it.', 'groupHeader'],
      ['plan name field', 'Tier name', 'The public name of the plan. One value that appears in three places — the card heading, the button, and the add-on label.', 'groupHeader'],
      ['AI pill', '.ai-pill', 'The AI half of the source tabs — the product’s own pill, with the sparkle and the yellow-to-purple gradient edge. Two stacked backgrounds make that edge: a flat fill clipped to the padding box, the gradient clipped to the border box, showing through a transparent 1px border. Unselected it dims rather than changing shape.', 'groupHeader'],
      ['AI sparkle', '.ai-pill__mark', 'The four-point glyph inside the AI pill. A flex box rather than a plain wrapper, so the icon centres instead of resting on a text baseline.', 'groupHeader'],
      ['source tabs', '.ed-source', 'Two tabs hard right above a copy field: AI or Custom. Used twice — over the Description and over the Price explainer. Custom is the default, and it is what copy written before the choice existed counts as. Choosing AI hands that field to the assistant and makes it read-only here.', 'groupHeader'],
      ['source label', '.ed-source__label', 'The word to the left of the AI/Custom tabs, naming which field they govern.', 'groupHeader'],
      ['description field', 'Description', 'The paragraph under the plan name. Type the whole thing; never shorten it yourself, because the card measures the space and adds "… more" where it needs to.', 'groupHeader'],
    ]],
    ['group-pricing', 'Pricing group', 'edit', 'Group 3. What it costs. Every price here belongs to one way of paying.', [
      ['standard price field', 'Full price', 'The undiscounted price, in the currency of the country you picked.', 'groupPricing'],
      ['currency mark', '.ed-currency', 'The currency symbol pinned inside a price field. Read off the country you picked rather than typed into the value, so the number stays a number.', 'groupPricing'],
      ['price unit field', 'Price per', 'Everything after the slash — the “month” in “$29.99/month”. It belongs to the way of paying rather than to this plan, so what you write here reads the same on every plan priced that way. Leave it and it uses the name of the cadence itself, in lower case.', 'groupPricing'],
      ['apply discount toggle', 'Apply discount', 'Turns on a promotional price. Switching it on fills in a starting discount price for you, twenty percent under standard, which you can then change.', 'groupPricing'],
      ['discount price field', 'Discount price', 'The promotional price. Only appears when the discount is on, and it turns red if you type a number at or above the standard price, because that is not a discount.', 'groupPricing'],
      ['button field', 'Button', 'What the card’s button says, written out. It sits under the price explainer and is not part of the discount — every plan has a button. Leave it empty and it falls back to “Get” and the plan’s name.', 'groupPricing'],
      ['button savings menu', 'Add the saving', 'Only with a discount, because only then is there a saving to name. It offers the plain wording and the two that add the saving, as money or as a percentage, each shown as the button it produces. Picking one writes it into the Button field above, where you can then edit it.', 'groupPricing'],
      ['price explainer field', 'Price explainer', 'The sentence under the price — “For the first 3 months, then $34.99/monthly”. Only appears where there is a discount to explain. Editable, with the same AI or Custom choice as the Description; empty falls back to the sentence built from the intro months, the full price and the cadence.', 'groupPricing'],

  var SVGNS = 'http://www.w3.org/2000/svg';
  function rect(r, cls) {
    var el = document.createElementNS(SVGNS, 'rect');
    el.setAttribute('x', r[0]); el.setAttribute('y', r[1]);
    el.setAttribute('width', r[2]); el.setAttribute('height', r[3]);
    el.setAttribute('rx', '1.5');
    el.setAttribute('class', cls);
    return el;
  }
  function wireframe(mapId, part) {
    var map = MAPS[mapId];
    if (!map || !map.parts[part]) return null;
    var svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', map.vb);
    svg.setAttribute('class', 'vis');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Where ' + part + ' sits');
    (map.furn || []).forEach(function (f) { svg.appendChild(rect(f, 'w')); });
    Object.keys(map.parts).forEach(function (k) {
      if (k !== part) svg.appendChild(rect(map.parts[k], 'w'));
    });
    var r = map.parts[part];
    // Big regions get a wash and an edge; small ones read better filled solid.
    if (r[2] * r[3] > 1400) {
      svg.appendChild(rect(r, 'on-wash'));
      svg.appendChild(rect(r, 'on-edge'));
    } else {
      svg.appendChild(rect(r, 'on-fill'));
    }
    return svg;
  }

  var CUSTOM_ID = 'custom';
  var TABS = [
    { id: 'default', label: 'Default view', note: 'Before you open a step' },
    { id: 'edit', label: 'Edit view', note: 'Once a step is open' },
    { id: 'archive', label: 'Archive', note: 'The frame, and the shared bits' }
  ];
  var KEY = 'acq-feedback-v4';
  var PRIS = ['now', 'next', 'idea'];
  var PRI_LABEL = { now: 'Now', next: 'Next', idea: 'Idea' };
  var open = {};

  var store = { notes: {}, pri: {}, custom: [], tab: 'default' };
  try {
    var raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (raw && raw.notes) {
      store = {
        notes: raw.notes || {}, pri: raw.pri || {}, custom: raw.custom || [],
        tab: ['edit', 'archive'].indexOf(raw.tab) >= 0 ? raw.tab : 'default'
      };
    } else {
      // Carry notes forward from earlier versions of this page.
      var old = JSON.parse(localStorage.getItem('acq-feedback-v3') ||
                           localStorage.getItem('acq-feedback-v2') || 'null');
      if (old && old.notes) { store.notes = old.notes; store.pri = old.pri || {}; store.custom = old.custom || []; }
      else {
        var v1 = JSON.parse(localStorage.getItem('acq-feedback-v1') || 'null');
        if (v1) store.notes = v1;
      }
    }
  } catch (e) { /* private mode, or nothing saved */ }

  var sheet = document.getElementById('sheet');
  var tabsEl = document.getElementById('tabs');
  var tally = document.getElementById('tally');
  var toast = document.getElementById('toast');
  var toastTimer;
  /** Set by the boot probe. null until we know; false when there is no dev server. */
  var live = null;
  var busy = false;

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* private mode */ }
  }
  function say(msg) {
    toast.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.textContent = ''; }, 2800);
  }
  function noted(name) { return (store.notes[name] || '').trim(); }
  function grow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  function esc(s) { return s.replace(/"/g, '\\"'); }

  /**
   * Sends one instruction to Claude Code running in this checkout.
   *
   * Only possible when the page is served by the dev server — the published
   * artifact cannot reach localhost, which is why the buttons hide themselves
   * rather than failing when pressed.
   */
  function ask(body, statusEl, btn) {
    if (busy) { setStatus(statusEl, 'err', 'Claude is already working on something.'); return; }
    busy = true;
    setBusy(true);

    var started = Date.now();
    var tick = setInterval(function () {
      setStatus(statusEl, 'run', 'working… ' + Math.round((Date.now() - started) / 1000) + 's');
    }, 1000);
    setStatus(statusEl, 'run', 'working… 0s');

    fetch('/api/claude', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok || res.d.error) {
          setStatus(statusEl, 'err', res.d.error || 'Something went wrong.');
          return;
        }
        var bits = [];
        if (res.d.seconds != null) bits.push(res.d.seconds + 's');
        if (res.d.turns != null) bits.push(res.d.turns + ' turns');
        if (res.d.cost != null) bits.push('$' + Number(res.d.cost).toFixed(3));
        var head = 'done · ' + bits.join(' · ');
        var reply = (res.d.result || '').trim();
        setStatus(statusEl, res.d.ok === false ? 'err' : 'ok', reply ? head + '\n' + reply : head);
      })
      .catch(function (e) {
        setStatus(statusEl, 'err', 'Could not reach the dev server. ' + e.message);
      })
      .then(function () {
        clearInterval(tick);
        busy = false;
        setBusy(false);
        if (btn) btn.focus();
      });
  }

  function setStatus(el, state, text) {
    if (!el) return;
    el.dataset.state = state;
    el.textContent = text;
  }

  /**
   * While a run is in flight, nothing else may start one.
   *
   * Releasing does not simply enable everything — a row with an empty box was
   * disabled before the run and must stay that way.
   */
  function setBusy(on) {
    var all = document.getElementById('sendall');
    if (all) all.disabled = on;
    Array.prototype.forEach.call(document.querySelectorAll('.send'), function (b) {
      if (on) { b.disabled = true; return; }
      var row = b.closest('.row');
      b.disabled = !(row && noted(row.dataset.name));
    });
  }

  function groups() {
    return AREAS.concat([[CUSTOM_ID, 'Your own', 'both',
      'Anything with no name yet. Say what it does and where, and I will name it.',
      store.custom.map(function (c) {
        return [c.name, c.anchor || 'added by you', c.what || '', null];
      })]]);
  }
  function inTab(g, tab) {
    if (g[2] === tab) return true;
    return g[2] === 'both' && tab !== 'archive';
  }
  /** How a section is titled outside the tabs — in the copy, where there is no tab. */
  function fullTitle(g) {
    if (g[2] === 'default') return 'Default view — ' + g[1];
    if (g[2] === 'edit') return 'Edit view — ' + g[1];
    return g[1];
  }

  // ── Tabs ──────────────────────────────────────────────
  function buildTabs() {
    tabsEl.textContent = '';
    TABS.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.dataset.tab = t.id;
      b.setAttribute('aria-selected', store.tab === t.id ? 'true' : 'false');

      var label = document.createElement('span');
      label.className = 'tab__label';
      label.textContent = t.label;
      var note = document.createElement('span');
      note.className = 'tab__note';
      note.textContent = t.note;
      var badge = document.createElement('span');
      badge.className = 'tab__badge';
      badge.dataset.for = t.id;

      b.appendChild(label); b.appendChild(note); b.appendChild(badge);
      b.addEventListener('click', function () {
        if (store.tab === t.id) return;
        store.tab = t.id;
        save();
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
      });
      tabsEl.appendChild(b);
    });
  }

  // ── Render ────────────────────────────────────────────
  function buildRow(name, anchor, what, mapId, isCustom, sectionTitle) {
    var el = document.createElement('div');
    el.className = 'row';
    el.dataset.hay = (name + ' ' + anchor + ' ' + what).toLowerCase();
    el.dataset.name = name;

    var c1 = document.createElement('div');
    c1.className = 'name';
    c1.textContent = name;
    var a = document.createElement('code');
    a.className = 'anchor';
    a.textContent = anchor;
    c1.appendChild(a);

    var c2 = document.createElement('div');
    var art = mapId ? wireframe(mapId, name) : null;
    if (art) c2.appendChild(art);
    else {
      var none = document.createElement('div');
      none.className = 'vis-none';
      none.textContent = 'no map yet';
      c2.appendChild(none);
    }

    var c3 = document.createElement('div');
    c3.className = 'what';
    c3.textContent = what;

    var c4 = document.createElement('div');
    c4.className = 'cell';

    var ta = document.createElement('textarea');
    ta.rows = 1;
    ta.placeholder = 'What should change here?';
    ta.value = store.notes[name] || '';
    ta.setAttribute('aria-label', 'Feedback for ' + name);

    var pri = document.createElement('div');
    pri.className = 'pri';
    PRIS.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      b.dataset.p = p;
      b.textContent = PRI_LABEL[p];
      b.setAttribute('aria-label', PRI_LABEL[p] + ' — ' + name);
      b.addEventListener('click', function () {
        if (store.pri[name] === p) delete store.pri[name];
        else store.pri[name] = p;
        paintRow(el, name, pri);
        save();
        recount();
      });
      pri.appendChild(b);
    });

    ta.addEventListener('input', function () {
      store.notes[name] = ta.value;
      grow(ta);
      paintRow(el, name, pri);
      if (!busy) send.disabled = !ta.value.trim();
      save();
      recount();
    });

    var foot = document.createElement('div');
    foot.className = 'cell__foot';
    foot.appendChild(pri);
    var gap = document.createElement('span');
    gap.className = 'spacer';
    foot.appendChild(gap);

    var status = document.createElement('p');
    status.className = 'sent';

    var send = document.createElement('button');
    send.type = 'button';
    send.className = 'send';
    send.textContent = 'Send';
    send.title = 'Send this note to Claude Code, working in this checkout';
    send.hidden = !live;
    send.disabled = !(store.notes[name] || '').trim();
    send.addEventListener('click', function () {
      var text = (store.notes[name] || '').trim();
      if (!text) { setStatus(status, 'err', 'Write something first.'); return; }
      ask({ prompt: text, name: name, anchor: anchor, section: sectionTitle }, status, send);
    });
    foot.appendChild(send);

    // Cmd/Ctrl + Enter sends, so a note can go without reaching for the mouse.
    ta.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send.click(); }
    });

    c4.appendChild(ta);
    c4.appendChild(foot);
    c4.appendChild(status);

    if (isCustom) {
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'drop';
      del.textContent = 'Remove this area';
      del.addEventListener('click', function () {
        store.custom = store.custom.filter(function (c) { return c.name !== name; });
        delete store.notes[name];
        delete store.pri[name];
        save();
        render();
      });
      c4.appendChild(del);
    }

    el.appendChild(c1); el.appendChild(c2); el.appendChild(c3); el.appendChild(c4);
    paintRow(el, name, pri);
    requestAnimationFrame(function () { grow(ta); });
    return el;
  }

  function paintRow(el, name, pri) {
    if (noted(name)) el.setAttribute('data-note', '');
    else el.removeAttribute('data-note');
    if (store.pri[name]) el.setAttribute('data-pri', store.pri[name]);
    else el.removeAttribute('data-pri');
    Array.prototype.forEach.call(pri.children, function (b) {
      b.setAttribute('aria-pressed', store.pri[name] === b.dataset.p ? 'true' : 'false');
    });
  }

  function render() {
    sheet.textContent = '';
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === store.tab ? 'true' : 'false');
    });

    groups().filter(function (g) { return inTab(g, store.tab); }).forEach(function (group) {
      var id = group[0], title = group[1], view = group[2], blurb = group[3], rows = group[4];
      var isCustom = id === CUSTOM_ID;
      var domId = 'sec-' + id;

      var sec = document.createElement('section');
      sec.id = domId;
      sec.dataset.sec = id;
      sec.dataset.view = view;
      if (!open[id]) sec.className = 'shut';

      var head = document.createElement('button');
      head.type = 'button';
      head.className = 'sec-head';
      head.setAttribute('aria-expanded', open[id] ? 'true' : 'false');

      var chev = document.createElement('span');
      chev.className = 'sec-head__chev';
      var h2 = document.createElement('h2');
      h2.className = 'sec-head__title';
      h2.textContent = title;
      var count = document.createElement('span');
      count.className = 'sec-head__count';
      count.dataset.for = id;

      head.appendChild(chev); head.appendChild(h2);
      if (view === 'both') {
        var shared = document.createElement('span');
        shared.className = 'sec-head__shared';
        shared.textContent = 'both views';
        head.appendChild(shared);
      }
      head.appendChild(count);
      head.addEventListener('click', function () {
        var shut = !sec.classList.contains('shut');
        sec.classList.toggle('shut', shut);
        head.setAttribute('aria-expanded', shut ? 'false' : 'true');
        if (shut) delete open[id]; else open[id] = true;
      });
      sec.appendChild(head);

      if (blurb) {
        var p = document.createElement('p');
        p.className = 'sec-blurb';
        p.textContent = blurb;
        sec.appendChild(p);
      }

      rows.forEach(function (r) {
        sec.appendChild(buildRow(r[0], r[1], r[2], r[3], isCustom, fullTitle(group)));
      });

      if (isCustom) {
        var wrap = document.createElement('div');
        wrap.className = 'addrow';
        var add = document.createElement('button');
        add.type = 'button';
        add.className = 'act';
        add.textContent = 'Add an area';
        add.addEventListener('click', function () {
          var nm = prompt('What is it called? If it has no name yet, describe it and I will name it.');
          if (!nm || !nm.trim()) return;
          nm = nm.trim();
          if (store.custom.some(function (c) { return c.name === nm; })) { say('That one is already listed'); return; }
          var where = prompt('Where is it? A selector, a screen, or just "top right of the panel".') || 'added by you';
          store.custom.push({ name: nm, anchor: where.trim(), what: '' });
          open[CUSTOM_ID] = true;
          save();
          render();
          var t = sheet.querySelector('[data-name="' + esc(nm) + '"] textarea');
          if (t) t.focus();
        });
        wrap.appendChild(add);
        sec.appendChild(wrap);
      }

      sheet.appendChild(sec);

    });

    recount();
  }

  // ── Counts ────────────────────────────────────────────
  function recount() {
    var counts = { now: 0, next: 0, idea: 0, none: 0 };
    var total = 0;
    var perTab = { default: 0, edit: 0, archive: 0 };

    groups().forEach(function (group) {
      var n = 0;
      group[4].forEach(function (r) {
        if (!noted(r[0])) return;
        n++; total++;
        counts[store.pri[r[0]] || 'none']++;
      });
      if (n) {
        if (group[2] === 'both') { perTab.default += n; perTab.edit += n; }
        else perTab[group[2]] += n;
      }
      var el = sheet.querySelector('[data-for="' + group[0] + '"]');
      if (!el) return;
      el.textContent = group[4].length + (group[4].length === 1 ? ' area' : ' areas');
      if (n) {
        var b = document.createElement('b');
        b.textContent = ' · ' + n + ' noted';
        el.appendChild(b);
      }
    });

    TABS.forEach(function (t) {
      var el = tabsEl.querySelector('[data-for="' + t.id + '"]');
      if (el) el.textContent = perTab[t.id] ? String(perTab[t.id]) : '';
    });

    tally.textContent = '';
    if (!total) { tally.textContent = 'Nothing noted yet'; return; }
    var b0 = document.createElement('b');
    b0.textContent = total + ' noted';
    tally.appendChild(b0);
    [['now', 'c-now'], ['next', 'c-next'], ['idea', 'c-idea']].forEach(function (p) {
      if (!counts[p[0]]) return;
      var s = document.createElement('span');
      s.className = p[1];
      s.textContent = '   ' + counts[p[0]] + ' ' + PRI_LABEL[p[0]].toLowerCase();
      tally.appendChild(s);
    });
    if (counts.none) {
      var s2 = document.createElement('span');
      s2.textContent = '   ' + counts.none + ' unmarked';
      tally.appendChild(s2);
    }
  }

  // ── Gathering every note ──────────────────────────────
  // Always takes every note, from all three tabs — a tab is a way to look at
  // the table, not a way to cut down what gets sent.
  function assemble() {
    var all = [];
    groups().forEach(function (group) {
      group[4].forEach(function (r) {
        if (!noted(r[0])) return;
        all.push({
          section: fullTitle(group), name: r[0], anchor: r[1],
          pri: store.pri[r[0]] || null,
          text: store.notes[r[0]].trim().replace(/\s+/g, ' ')
        });
      });
    });
    if (!all.length) return null;

    var lines = [];
    function block(items, heading) {
      lines.push(heading);
      var last = null;
      items.forEach(function (x) {
        if (x.section !== last) { lines.push('### ' + x.section); last = x.section; }
        lines.push('- **' + x.name + '** (`' + x.anchor + '`) — ' + x.text);
      });
      lines.push('');
    }

    if (all.some(function (x) { return x.pri; })) {
      [['now', '## Do first'], ['next', '## Then'], ['idea', '## Ideas, no rush'], [null, '## Unmarked']]
        .forEach(function (g) {
          var items = all.filter(function (x) { return x.pri === g[0]; });
          if (items.length) block(items, g[1]);
        });
    } else {
      var last = null;
      all.forEach(function (x) {
        if (x.section !== last) { lines.push('## ' + x.section); last = x.section; }
        lines.push('- **' + x.name + '** (`' + x.anchor + '`) — ' + x.text);
      });
    }

    return {
      count: all.length,
      text: 'Feedback on the acquisition tool — ' + all.length +
            (all.length === 1 ? ' area' : ' areas') + ':\n\n' + lines.join('\n').trim()
    };
  }

  document.getElementById('copy').addEventListener('click', function () {
    var got = assemble();
    if (!got) { say('Nothing noted yet'); return; }
    navigator.clipboard.writeText(got.text).then(
      function () { say('Copied ' + got.count + ' from all tabs'); },
      function () { say('Copy blocked by the browser; select the text by hand'); }
    );
  });

  // ── Send all ──────────────────────────────────────────
  // One run carrying the whole pass, in the order the priorities set. Sending
  // note by note would start a fresh agent per row, and they would undo each
  // other where two notes touch the same file.
  document.getElementById('sendall').addEventListener('click', function () {
    var got = assemble();
    var status = document.getElementById('allstatus');
    if (!got) { setStatus(status, 'err', 'Nothing noted yet.'); return; }
    if (!confirm('Send all ' + got.count + ' notes to Claude? It will edit files in this checkout, and commit nothing.')) return;
    ask({
      prompt: got.text + '\n\nWork through these in the order given. NAMING.md maps every' +
              ' component name to where it lives. Keep the build passing, and do not commit.'
    }, status, null);
  });

  document.getElementById('clear').addEventListener('click', function () {
    if (!confirm('Clear every note on this page, in both tabs? Areas you added stay.')) return;
    store.notes = {};
    store.pri = {};
    save();
    render();
    say('Cleared');
  });

  function sizeHead() {
    var top = document.querySelector('.top');
    if (top) document.documentElement.style.setProperty('--head-h', top.offsetHeight + 'px');
  }
  window.addEventListener('resize', sizeHead);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeHead);

  /**
   * Is there a dev server behind this page?
   *
   * Served from Vite, /api/claude answers and the send buttons appear. Opened
   * as a published artifact, the request cannot leave the sandbox, so they stay
   * hidden and Copy feedback remains the way out. Neither case is an error, so
   * neither says anything alarming.
   */
  function probe() {
    fetch('/api/claude', { method: 'GET' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        live = Boolean(d && d.available);
        if (!live) { offline(); return; }
        document.getElementById('sendall').hidden = false;
        document.getElementById('copy').classList.remove('primary');
        Array.prototype.forEach.call(document.querySelectorAll('.send'), function (b) {
          b.hidden = false;
        });
        var lede = document.getElementById('lede');
        if (lede) {
          lede.textContent = 'Find the area, say what should change, then send it straight to Claude.';
        }
        sizeHead();
      })
      .catch(function () { live = false; offline(); });
  }

  /**
   * Says why there are no send buttons.
   *
   * Opened as a file:// or as a published artifact there is no dev server to
   * reach, and silently hiding the buttons reads as "this feature is missing"
   * rather than "you are on the wrong copy".
   */
  function offline() {
    var lede = document.getElementById('lede');
    if (!lede) return;
    lede.textContent = 'Find the area, say what should change, then copy it over. ';
    var a = document.createElement('a');
    a.href = 'http://localhost:5173/feedback.html';
    a.textContent = 'Open the localhost copy to send straight to Claude.';
    a.className = 'lede__link';
    lede.appendChild(a);
    sizeHead();
  }

  buildTabs();
  render();
  sizeHead();
  probe();
})();
</script>
